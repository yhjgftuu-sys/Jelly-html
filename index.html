<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e5dbe6">
<title>Citrus Jelly — Interactive 3D Tree</title>
<style>
:root{color-scheme:light;--bg:#e5dbe6;--panel:rgba(250,247,250,.88);--ink:#2b2150;--muted:#6b5f8d;--accent:#55418b;--accent2:#7d80da;--surface:#e5dbe6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1536;--panel:rgba(34,25,62,.88);--ink:#f5f5f4;--muted:#c0b4d7;--accent:#7d80da;--accent2:#bba0d0;--surface:#3b2f66}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#scene:active{cursor:grabbing}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(350px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px));overflow:auto;padding:15px 16px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--accent2) 75%,transparent);border-radius:19px;box-shadow:0 12px 34px #34235b26}
h1{font-size:21px;letter-spacing:-.5px;margin:0}.sub{margin:3px 0 11px;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:6px;margin:8px 0}button{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 6px;cursor:pointer;transition:background .18s,transform .18s}button:hover{background:color-mix(in srgb,var(--accent2) 25%,var(--surface))}button:active{transform:scale(.98)}button[aria-pressed=true]{background:var(--accent);color:white}
summary{cursor:pointer;color:var(--muted);margin:8px 0}label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:8px;margin:8px 0;font-size:12px}input[type=range]{accent-color:var(--accent);width:100%;margin:0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:12px;text-align:center}.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stats span{display:block;font-size:10px;color:var(--muted)}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:var(--panel);border:1px solid #7d80da77;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:11px;backdrop-filter:blur(12px);pointer-events:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:26px;text-align:center;background:var(--bg);color:var(--ink);font-size:15px;z-index:10}#error.show{display:grid}[hidden]{display:none!important}
@media(max-width:600px){#ui{padding:12px 13px;width:min(340px,calc(100vw - 24px));max-height:55dvh}h1{font-size:19px}.sub{font-size:11px;margin-bottom:8px}button{padding:7px 4px;font-size:12px}.stats b{font-size:16px}.stats span{font-size:9px}#hint{font-size:10px;top:calc(8px + env(safe-area-inset-top,0px));right:8px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D tree with jelly mandarins"></canvas>
<div id="hint">Drag to orbit · Tap fruit · Pinch to zoom</div>
<section id="ui">
<h1>Citrus Jelly</h1><p class="sub">Drag to explore the tree. Tap or pull a fruit to release it.</p>
<div class="row"><button id="shake">Shake</button><button id="pause" aria-pressed="false">Pause</button><button id="reset">Reset</button></div>
<div class="row" id="palette"><button data-p="mandarin" aria-pressed="true">Mandarin</button><button data-p="yuzu" aria-pressed="false">Yuzu</button><button data-p="blood" aria-pressed="false">Blood Orange</button></div>
<details open><summary>Tune the jelly</summary>
<label>Firmness<input id="firm" type="range" min="0" max="1" step=".01" value=".55"></label>
<label>Damping<input id="damp" type="range" min="0" max="1" step=".01" value=".4"></label>
<label>Ripeness<input id="ripe" type="range" min="0" max="1" step=".01" value=".7"></label>
</details>
<div class="stats"><div><b id="n1">0</b><span>On tree</span></div><div><b id="n2">0</b><span>Regrowing</span></div><div><b id="n3">0</b><span>Fallen</span></div><div><b id="n4">0</b><span>Leaves</span></div><div><b id="n5">0</b><span>Litter</span></div></div>
</section>
<div id="error" role="alert"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const canvas=document.querySelector('#scene'), errorBox=document.querySelector('#error');
const showError=m=>{errorBox.textContent=m;errorBox.classList.add('show')};
let renderer;
try{
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
}catch(e){showError('This browser could not start WebGL graphics. Try Chrome, enable hardware acceleration, or use another browser.');throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.8));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe5dbe6);scene.fog=new THREE.Fog(0xe5dbe6,12,28);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
let yaw=.55,pitch=.23,distance=8.6;const target=new THREE.Vector3(0,1.65,0);
const hemi=new THREE.HemisphereLight(0xfff7ff,0x665077,2.0);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff1db,3.1);key.position.set(-4,8,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xb9c5ff,2.1);rim.position.set(5,4,-5);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(12,80),new THREE.MeshStandardMaterial({color:0xd4c5d9,roughness:.94,metalness:0}));ground.rotation.x=-Math.PI/2;ground.position.y=-.035;scene.add(ground);
const palettes={mandarin:{ripe:0xff8a12,unripe:0xb5c66b,wood:0x825027,leaf:0x4d8a42},yuzu:{ripe:0xf4d64c,unripe:0x9bbd59,wood:0x8c6836,leaf:0x729b45},blood:{ripe:0xc52e43,unripe:0xeaa04b,wood:0x754344,leaf:0x34744b}};
let activePalette='mandarin',paused=false,shake=0,elapsed=0,fruitObjects=[],leafObjects=[],branchObjects=[],litterObjects=[],regrowing=0;
const params={firm:.55,damp:.4,ripe:.7};let treeGroup;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mat(color,roughness=.45,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
function makeBranch(a,b,r1,r2,color){
 const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),delta=end.clone().sub(start),len=delta.length();
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,len,8,1),mat(color,.83));
 mesh.position.copy(start).add(end).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());treeGroup.add(mesh);branchObjects.push(mesh);return mesh;
}
function makeLeaf(pos,dir,len,width,color){
 const group=new THREE.Group();group.position.copy(pos);
 const shape=new THREE.Shape();shape.moveTo(0,0);shape.quadraticCurveTo(width*.9,len*.25,width*.42,len*.68);shape.quadraticCurveTo(width*.12,len,0,len);shape.quadraticCurveTo(-width*.12,len,-width*.42,len*.68);shape.quadraticCurveTo(-width*.9,len*.25,0,0);
 const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape,8),new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.62}));
 group.add(mesh);group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());group.rotateY(rand(-Math.PI,Math.PI));treeGroup.add(group);leafObjects.push(group);return group;
}
function makeFruit(pos,index){
 const r=rand(.135,.175),geo=new THREE.SphereGeometry(r,28,20);geo.scale(1,.91,1);
 const material=new THREE.MeshPhysicalMaterial({color:palettes[activePalette].ripe,roughness:.22,metalness:0,clearcoat:.9,clearcoatRoughness:.16,ior:1.35,thickness:.5,attenuationColor:new THREE.Color(palettes[activePalette].ripe),attenuationDistance:.5});
 const mesh=new THREE.Mesh(geo,material);mesh.position.copy(pos);mesh.userData={index,home:pos.clone(),velocity:new THREE.Vector3(),falling:false,age:rand(0,1),phase:rand(0,6.28),r};treeGroup.add(mesh);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.018,.075,7),mat(palettes[activePalette].wood,.8));stem.position.set(0,r*.88,0);mesh.add(stem);
 const leaf=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),mat(palettes[activePalette].leaf,.65));leaf.scale.set(1.5,.4,.7);leaf.position.set(.035,r+.02,0);leaf.rotation.z=.35;mesh.add(leaf);
 fruitObjects.push(mesh);return mesh;
}
function buildTree(){
 if(treeGroup)scene.remove(treeGroup);
 treeGroup=new THREE.Group();scene.add(treeGroup);fruitObjects=[];leafObjects=[];branchObjects=[];litterObjects=[];
 const wood=palettes[activePalette].wood,leaf=palettes[activePalette].leaf;
 // A gently tapering, branching trunk
 const trunkPts=[[0,0,0],[.025,.48,0],[-.04,1.0,.025],[.04,1.52,0],[.0,2.0,-.02],[-.12,2.48,.02],[.02,2.95,0],[.08,3.35,-.04]];
 for(let i=1;i<trunkPts.length;i++)makeBranch(trunkPts[i-1],trunkPts[i],.17*(1-i/9),.17*(1-(i+1)/9),wood);
 const tips=[];
 for(let i=2;i<=6;i++){
  const base=new THREE.Vector3(...trunkPts[i]);
  for(let s=0;s<3;s++){
   const angle=i*1.63+s*2.094+rand(-.28,.28),rise=rand(.25,.52),reach=rand(.38,.72);
   let prev=base.clone(),tip=prev.clone();
   for(let j=1;j<=4;j++){const t=j/4;tip=base.clone().add(new THREE.Vector3(Math.cos(angle)*reach*t,rise*t+Math.sin(t*Math.PI)*.1,Math.sin(angle)*reach*t));makeBranch(prev.toArray(),tip.toArray(),.055*(1-t)+.012,.055*(1-t)+.008,wood);prev=tip.clone()}
   tips.push({pos:tip.clone(),angle});
   for(let j=0;j<8;j++){const t=rand(.2,1),p=base.clone().lerp(tip,t);p.add(new THREE.Vector3(rand(-.22,.22),rand(-.12,.25),rand(-.22,.22)));const dir=new THREE.Vector3(Math.cos(angle+rand(-1,1)),rand(.2,1),Math.sin(angle+rand(-1,1)));makeLeaf(p,dir,rand(.16,.29),rand(.045,.085),leaf)}
  }
 }
 // Fuller outer canopy with small leaf clusters
 for(let i=0;i<130;i++){
  const y=rand(1.05,3.65),rad=.35+.7*Math.sin(Math.PI*clamp((y-1)/3,0,1));
  const a=rand(0,Math.PI*2),rr=Math.sqrt(Math.random())*rad;
  const p=new THREE.Vector3(Math.cos(a)*rr,y+rand(-.15,.15),Math.sin(a)*rr);
  const d=new THREE.Vector3(Math.cos(a)*.5,rand(.25,1),Math.sin(a)*.5);
  makeLeaf(p,d,rand(.13,.25),rand(.04,.075),leaf);
 }
 tips.forEach((t,i)=>{if(i%2===0||Math.random()>.3){const p=t.pos.clone().add(new THREE.Vector3(rand(-.18,.18),rand(-.08,.18),rand(-.18,.18)));makeFruit(p,i)}});
 // keep a healthy, visible fruit count
 while(fruitObjects.length<16){const y=rand(1.55,3.45),rad=.35+.65*Math.sin(Math.PI*(y-1)/3),a=rand(0,Math.PI*2);makeFruit(new THREE.Vector3(Math.cos(a)*rand(.3,rad),y,Math.sin(a)*rand(.3,rad)),fruitObjects.length)}
 updateFruitColors();
}
function updateFruitColors(){const pal=palettes[activePalette];fruitObjects.forEach(f=>{const c=new THREE.Color(f.falling?pal.ripe:(f.age<params.ripe?pal.ripe:pal.unripe));f.material.color.copy(c);f.material.attenuationColor.copy(c)})}
function resetTree(){buildTree();regrowing=0;document.querySelector('#n3').textContent='0';}
function releaseFruit(f){if(!f||f.userData.falling)return;f.userData.falling=true;f.userData.velocity.set(rand(-.65,.65),rand(.1,.9),rand(-.65,.65));f.userData.releasedAt=elapsed;f.userData.home=f.position.clone();f.userData.index=-1}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null,dragged=false;
function pick(e){const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(fruitObjects.filter(f=>!f.userData.falling),false)[0]?.object||null}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,fruit:pick(e),yaw,pitch,dist:distance};dragged=false;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>6)dragged=true;if(down.fruit&&dragged){const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion),up=new THREE.Vector3(0,1,0);down.fruit.position.addScaledVector(right,dx*.004).addScaledVector(up,-dy*.004);down.fruit.userData.velocity.set(dx*.018,-dy*.018,0);down.x=e.clientX;down.y=e.clientY}else if(dragged){yaw=down.yaw-dx*.008;pitch=clamp(down.pitch+dy*.006,-.05,1.05)}});
canvas.addEventListener('pointerup',e=>{if(down){if(down.fruit){if(dragged)releaseFruit(down.fruit);else if(!dragged)releaseFruit(down.fruit)}down=null}});
canvas.addEventListener('pointercancel',()=>down=null);
canvas.addEventListener('wheel',e=>{distance=clamp(distance+e.deltaY*.008,4.6,14);e.preventDefault()},{passive:false});
let pinchStart=0;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);distance=clamp(distance-(d-pinchStart)*.012,4.6,14);pinchStart=d}},{passive:true});
document.querySelector('#shake').onclick=()=>{shake=1.7;fruitObjects.forEach(f=>{if(!f.userData.falling)f.userData.velocity.add(new THREE.Vector3(rand(-1.4,1.4),rand(.2,1.4),rand(-1.4,1.4)))})};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause';e.currentTarget.setAttribute('aria-pressed',String(paused))};
document.querySelector('#reset').onclick=resetTree;
document.querySelectorAll('#palette button').forEach(b=>b.onclick=()=>{activePalette=b.dataset.p;document.querySelectorAll('#palette button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));buildTree()});
for(const k of ['firm','damp','ripe'])document.querySelector('#'+k).addEventListener('input',e=>{params[k]=+e.target.value;updateFruitColors()});
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!paused){elapsed+=dt;shake=Math.max(0,shake-dt);
  const damp=1-params.damp*.8;
  fruitObjects.forEach(f=>{
   if(f.userData.falling){const v=f.userData.velocity;v.y-=5.2*dt;v.multiplyScalar(Math.pow(.985+params.damp*.014,dt*60));f.position.addScaledVector(v,dt);f.rotation.x+=v.z*dt*2;f.rotation.z-=v.x*dt*2;
    if(f.position.y<f.userData.r){f.position.y=f.userData.r;v.y=Math.abs(v.y)>.65?Math.abs(v.y)*(.25+.35*params.firm):0;v.x*=.86;v.z*=.86;if(Math.abs(v.y)<.08){v.y=0;v.x*=.96;v.z*=.96}}
   }else{const home=f.userData.home;f.position.y=home.y+Math.sin(elapsed*2.1+f.userData.phase)*(.012+shake*.055);f.position.x=home.x+Math.sin(elapsed*1.4+f.userData.phase)*.012;f.rotation.z=Math.sin(elapsed+f.userData.phase)*.035*params.firm}
  });
  leafObjects.forEach((l,i)=>{l.rotation.z+=Math.sin(elapsed*1.4+i*.8)*dt*.018*(1+shake*5);l.rotation.x+=Math.cos(elapsed+i)*dt*.012*(1+shake*4)});
 }
 const cp=Math.cos(pitch);camera.position.set(target.x+distance*Math.sin(yaw)*cp,target.y+distance*Math.sin(pitch),target.z+distance*Math.cos(yaw)*cp);camera.lookAt(target);
 const pal=palettes[activePalette];scene.background.set(0xe5dbe6);scene.fog.color.set(0xe5dbe6);
 renderer.render(scene,camera);
 document.querySelector('#n1').textContent=fruitObjects.filter(f=>!f.userData.falling).length;
 document.querySelector('#n2').textContent=regrowing;
 document.querySelector('#n3').textContent=fruitObjects.filter(f=>f.userData.falling).length;
 document.querySelector('#n4').textContent=leafObjects.length;
 document.querySelector('#n5').textContent=litterObjects.length;
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.8));renderer.setSize(innerWidth,innerHeight,false)});
if(matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.dataset.theme='dark';scene.background.set(0x1d1536);scene.fog.color.set(0x1d1536);ground.material.color.set(0x302448)}
buildTree();animate();
</script>
</body>
</html>
